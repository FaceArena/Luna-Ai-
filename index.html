<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Luna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<link data-trunk rel="css" href="style.css">
<link data-trunk rel="rust" data-wasm-opt="z">
<script>
(() => {
  const SUPABASE_URL = "https://efycijufegudtvvhnxzv.supabase.co";
  const VERIFIER_KEY = "luna_telegram_pkce_verifier";

  window.lunaTelegramStart = async () => {
    try {
      const bytes = new Uint8Array(32);
      crypto.getRandomValues(bytes);
      const verifier = btoa(String.fromCharCode(...bytes))
        .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
      const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier));
      const challengeBytes = new Uint8Array(digest);
      const challenge = btoa(String.fromCharCode(...challengeBytes))
        .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
      sessionStorage.setItem(VERIFIER_KEY, verifier);

      const authUrl = new URL(SUPABASE_URL + "/auth/v1/authorize");
      authUrl.searchParams.set("provider", "custom:telegram");
      authUrl.searchParams.set("scopes", "openid profile");
      authUrl.searchParams.set("redirect_to", window.location.origin);
      authUrl.searchParams.set("code_challenge", challenge);
      authUrl.searchParams.set("code_challenge_method", "s256");
      window.location.assign(authUrl.toString());
    } catch (error) {
      window.alert("Не удалось начать вход через Telegram. Обновите страницу и попробуйте ещё раз.");
      window.location.reload();
    }
  };

  const params = new URLSearchParams(window.location.search);
  const authCode = params.get("code");
  const authError = params.get("error_description") || params.get("error");
  if (authCode || authError) {
    (async () => {
      try {
        if (authError) {
          sessionStorage.removeItem(VERIFIER_KEY);
          throw new Error("Telegram не подтвердил вход. Попробуйте ещё раз.");
        }
        const verifier = sessionStorage.getItem(VERIFIER_KEY);
        sessionStorage.removeItem(VERIFIER_KEY);
        if (!verifier) throw new Error("Сессия входа не найдена. Начните вход заново.");
        const response = await fetch("/api/auth/telegram/exchange", {
          method: "POST",
          headers: { "content-type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ auth_code: authCode, code_verifier: verifier })
        });
        if (!response.ok) {
          const message = await response.text();
          throw new Error(message || "Не удалось завершить вход.");
        }
        window.history.replaceState({}, "", window.location.pathname);
        window.location.reload();
      } catch (error) {
        window.history.replaceState({}, "", window.location.pathname);
        window.alert(error instanceof Error ? error.message : "Ошибка входа через Telegram.");
      }
    })();
  }
})();
</script>
</head>
<body>
<div class="bg"><i></i><i></i><i></i><div class="spot"></div></div>
</body>
</html>
