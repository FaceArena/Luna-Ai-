[package]
name = "luna-web"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "luna-web"
path = "main.rs"

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = { version = "0.5", features = ["http"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-streams = "0.4"
futures-util = "0.3"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "Node", "Storage",
  "HtmlInputElement", "HtmlTextAreaElement", "HtmlAnchorElement",
  "PointerEvent", "DomRect", "AbortController", "AbortSignal", "ReadableStream",
  "CssStyleDeclaration", "DeviceOrientationEvent", "MediaQueryList",
  "VisualViewport", "FocusOptions", "ScrollToOptions", "ScrollBehavior", "DomTokenList", "KeyboardEvent", "SubmitEvent",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
