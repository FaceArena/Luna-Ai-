name: Luna checks

on:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  wasm-client:
    name: Check Leptos WASM client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust and WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Check client
        run: cargo check --target wasm32-unknown-unknown

  supabase-edge:
    name: Type-check Luna API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Edge Function
        run: deno check --no-lock supabase/functions/luna-api/index.ts
