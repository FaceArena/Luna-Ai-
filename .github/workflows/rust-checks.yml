name: Rust checks

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Check Leptos WASM client
        run: cargo check --target wasm32-unknown-unknown
      - name: Check Luna API server
        run: cargo check --manifest-path backend/Cargo.toml
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Supabase Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/luna-api/index.ts
      - name: Install Trunk
        run: cargo install trunk --locked
      - name: Build production frontend
        run: trunk build --release
      - name: Upload Cloudflare assets
        uses: actions/upload-artifact@v4
        with:
          name: luna-ai-cloudflare-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1
