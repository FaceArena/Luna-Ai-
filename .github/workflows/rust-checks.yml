name: Rust checks

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Check Leptos WASM client
        run: cargo check --target wasm32-unknown-unknown
      - name: Check Luna API server
        run: cargo check --manifest-path backend/Cargo.toml
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Supabase Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/luna-api/index.ts
      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Build production frontend
        run: trunk build --release
      - name: Upload Cloudflare assets
        uses: actions/upload-artifact@v4
        with:
          name: luna-ai-cloudflare-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1
      - name: Deploy production to Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: '05ac7140a70ea8feadd41b96a0e4ff3d'
          command: deploy
